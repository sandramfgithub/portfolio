name: portfolio-production

services:
  web:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./dist:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        aliases:
          - portfolio-web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/es"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: viveria-edge
